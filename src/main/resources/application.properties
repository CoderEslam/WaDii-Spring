spring.application.name=WaDii
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------- database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Driver and Hibernate dialect are detected from the URL: jdbc:postgresql://... or jdbc:mariadb://...
# The schema is owned by Flyway (src/main/resources/db/migration/<vendor>); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------------------------------------------------------------- security
security.jwt.secret-key=${JWT_SECRET_KEY}
# 24 hours
security.jwt.expiration-time=86400000
# Bootstrap super admin (created on startup if missing). Leave empty to skip.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Browser origins allowed by CORS (comma separated).
wadii.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3005}

# ---------------------------------------------------------------- deployment settings
# Business values (deadlines, fees, limits) are NOT here: admins change them at runtime through
# /api/v1/admin/config/{key}; they are stored as versions in the config_versions table.
wadii.timezone=Africa/Cairo
wadii.storage.root=uploads
wadii.rate-limit.enabled=true
wadii.rate-limit.login-per-minute=10
wadii.rate-limit.register-per-hour=20
wadii.jobs.expiration-interval-ms=60000
wadii.jobs.subscription-interval-ms=3600000

# Push (FCM HTTP v1). Disabled unless enabled and a service-account file is readable.
wadii.fcm.enabled=${FCM_ENABLED:false}
wadii.fcm.project-id=${FCM_PROJECT_ID:wadii-kmp}
wadii.fcm.credentials-path=${FCM_CREDENTIALS_PATH:}

# ---------------------------------------------------------------- connection pool (Hikari)
# The hosted MariaDB user is capped at 500 new connections per hour, so the pool stays small and fixed,
# with max-lifetime below the server's wait_timeout and keepalive pings on idle connections.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
