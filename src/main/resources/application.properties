spring.application.name=WaDii
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------- database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Driver and Hibernate dialect are detected from the URL: jdbc:postgresql://... or jdbc:mariadb://...
# The schema is owned by Flyway (src/main/resources/db/migration/<vendor>); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_absent

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---------------------------------------------------------------- security
security.jwt.secret-key=${JWT_SECRET_KEY}
# 24 hours
security.jwt.expiration-time=86400000
# Bootstrap super admin (created on startup if missing). Leave empty to skip.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------------------------------------------------------------- calls
agora.app-id=${AGORA_APP_ID}
agora.app-certificate=${AGORA_APP_CERTIFICATE}
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}
livekit.url=${LIVEKIT_URL}

# ---------------------------------------------------------------- push (FCM HTTP v1)
wadii.fcm.enabled=true
wadii.fcm.project-id=wadii-kmp
wadii.fcm.credentials-path=${FCM_CREDENTIALS_PATH:src/main/wadii.json}

# ---------------------------------------------------------------- business rules
wadii.timezone=Africa/Cairo
wadii.currency=EGP
wadii.storage.root=uploads

# Order response window: no new offers after the deadline; pending offers expire with it.
wadii.order.response-window-hours=48
wadii.order.max-targets=20
wadii.order.default-service-radius-km=50
# Provider marks the job done -> customer confirms. Auto-confirm after this many hours (0 = disabled).
wadii.order.auto-complete-hours=72

wadii.offer.default-validity-hours=48
wadii.offer.min-validity-hours=1
wadii.offer.max-validity-hours=168

# A PENDING payment without a proof expires after this many hours (the customer can start a new one).
wadii.payment.pending-ttl-hours=72
wadii.payment.max-proofs-per-payment=5

# No-show: cancel the order automatically and (for PROVIDER_NO_SHOW) request a full refund.
wadii.no-show.cancel-order=true
wadii.no-show.refund-on-provider-no-show=true
wadii.no-show.grace-minutes=30

# Platform commission on completed orders (percent of gross). 0 = provider keeps 100%.
wadii.commission.percent=0

# Platform rules provider policies may not weaken.
wadii.platform-policy.max-cancellation-fee-percent=50
wadii.platform-policy.min-warranty-days=0
wadii.platform-policy.min-refund-window-days=0
wadii.platform-policy.max-no-show-fee-percent=50

# Fraud signals
wadii.fraud.max-disputes-per-30-days=5
wadii.fraud.max-provider-cancellations-per-30-days=5
wadii.fraud.max-auth-failures-per-hour=20

# Scheduled jobs
wadii.jobs.expiration-interval-ms=60000
wadii.jobs.rematch-interval-ms=600000
wadii.jobs.stats-interval-ms=3600000


# Rate limits (per client IP). See RateLimitFilter.
rate-limit.enabled=true
rate-limit.login-per-minute=5
rate-limit.refresh-per-minute=30
rate-limit.register-per-hour=10
rate-limit.upload-per-minute=30
rate-limit.card-per-minute=30
rate-limit.websocket-per-minute=30
rate-limit.sensitive-per-minute=20


# ---------------------------------------------------------------- connection pool (Hikari)
# The hosted MySQL user is capped at 500 new connections per hour (max_connections_per_hour),
# and the server closes idle connections after wait_timeout (check: SHOW VARIABLES LIKE 'wait_timeout').
# - Keep the pool small so restarts don't exhaust the hourly quota.
# - Keep max-lifetime BELOW the server's wait_timeout (by at least 30s) so Hikari retires
#   connections before the server kills them (this avoids "Failed to validate connection" warnings).
# - keepalive-time pings idle connections (no new connection is opened) so they aren't dropped.
# Quota math: 3 connections x (3600s / 240s) = ~45 new connections per hour, far below 500.
# If wait_timeout is shorter than ~5 minutes, lower max-lifetime and keepalive-time accordingly
# (e.g. wait_timeout=60s -> keepalive-time=30000, max-lifetime=45000).
spring.datasource.hikari.maximum-pool-size=3
# Fixed-size pool: minimum-idle equals maximum-pool-size, so idle-timeout is not needed.
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000